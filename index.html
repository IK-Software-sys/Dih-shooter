<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D FPS - Night Ops</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

        *, *::before, *::after {
            margin: 0; padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background-color: #0a0a1a;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Rajdhani', sans-serif;
        }

        canvas {
            display: block;
            width: 100vw; height: 100vh;
        }

        /* ========================
           UI LAYER
        ======================== */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* ========================
           LOADING SCREEN
        ======================== */
        #loading {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5), 0 0 40px rgba(0, 212, 255, 0.3);
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .loader-bar-container {
            width: 280px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            border-radius: 2px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .loader-text {
            margin-top: 15px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* ========================
           CROSSHAIR
        ======================== */
        #crosshair-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 15;
        }

        #crosshair {
            width: 24px; height: 24px;
            position: relative;
        }

        .crosshair-line {
            position: absolute;
            background: rgba(0, 255, 136, 0.9);
            box-shadow: 0 0 6px rgba(0, 255, 136, 0.6);
        }

        .crosshair-line.h { width: 8px; height: 2px; top: 11px; }
        .crosshair-line.v { width: 2px; height: 8px; left: 11px; }
        .crosshair-line.hl { left: 0; }
        .crosshair-line.hr { right: 0; }
        .crosshair-line.vt { top: 0; }
        .crosshair-line.vb { bottom: 0; }
        .crosshair-dot {
            position: absolute;
            width: 3px; height: 3px;
            background: #00ff88;
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.8);
        }

        /* Hit marker flash */
        .hit-marker {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-size: 28px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.8);
            transition: opacity 0.1s;
        }

        .hit-marker.active {
            opacity: 1;
            animation: hitPulse 0.3s ease-out;
        }

        @keyframes hitPulse {
            0% { transform: translate(-50%, -50%) scale(1.5); }
            50% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* ========================
           SPEED EFFECTS
        ======================== */
        #speed-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.15s ease-out;
        }

        .speed-radial {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0, 212, 255, 0.15) 70%, rgba(0, 100, 255, 0.3) 100%);
        }

        .speed-lines {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 50px,
                rgba(0, 212, 255, 0.03) 50px,
                rgba(0, 212, 255, 0.03) 51px
            );
            animation: speedLines 0.5s linear infinite;
        }

        @keyframes speedLines {
            0% { transform: translateX(0); }
            100% { transform: translateX(-51px); }
        }

        /* ========================
           VIGNETTE & DAMAGE
        ======================== */
        #vignette {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 4;
        }

        #damage-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 6;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .damage-flash {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 0, 0, 0.3) 100%);
        }

        /* ========================
           HUD ELEMENTS
        ======================== */
        #hud-top-left {
            position: absolute;
            top: 20px; left: 20px;
            pointer-events: none;
        }

        #hud-top-right {
            position: absolute;
            top: 20px; right: 20px;
            pointer-events: none;
            text-align: right;
        }

        .hud-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: rgba(0, 212, 255, 0.7);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .hud-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        .hud-bar-container {
            width: 200px;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            margin-top: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hud-bar {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .hud-bar.health { background: linear-gradient(90deg, #ff4444, #ff8844); }
        .hud-bar.stamina { background: linear-gradient(90deg, #00d4ff, #00ff88); }

        #ammo-display {
            position: absolute;
            bottom: 30px;
            right: 50%;
            transform: translateX(50%);
            pointer-events: none;
            text-align: center;
        }

        .ammo-current {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .ammo-max {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: rgba(255,255,255,0.4);
        }

        /* ========================
           JOYSTICK
        ======================== */
        #joystick-left {
            position: absolute;
            bottom: 50px; left: 50px;
            width: 140px; height: 140px;
            pointer-events: auto;
        }

        /* ========================
           ACTION BUTTONS
        ======================== */
        .action-btn {
            position: absolute;
            border: none;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border-radius: 50%;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px;
            right: -2px; bottom: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            z-index: -1;
        }

        .action-btn:active {
            transform: scale(0.92);
        }

        .btn-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .btn-label {
            font-size: 9px;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* Jump Button */
        #btn-jump {
            bottom: 50px; right: 50px;
            width: 75px; height: 75px;
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1), inset 0 0 20px rgba(0, 212, 255, 0.05);
        }

        #btn-jump:active {
            background: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3), inset 0 0 20px rgba(0, 212, 255, 0.2);
        }

        /* Dash Button with Cooldown Ring */
        #btn-dash-container {
            position: absolute;
            bottom: 140px; right: 42px;
            width: 90px; height: 90px;
            pointer-events: none;
        }

        #btn-dash {
            position: absolute;
            top: 5px; left: 5px;
            width: 80px; height: 80px;
            background: rgba(255, 200, 0, 0.15);
            border: 2px solid rgba(255, 200, 0, 0.4);
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.1), inset 0 0 20px rgba(255, 200, 0, 0.05);
        }

        #btn-dash:active {
            background: rgba(255, 200, 0, 0.4);
            box-shadow: 0 0 30px rgba(255, 200, 0, 0.3), inset 0 0 20px rgba(255, 200, 0, 0.2);
        }

        #btn-dash.cooldown {
            opacity: 0.4;
            pointer-events: none;
        }

        .cooldown-ring {
            position: absolute;
            top: 0; left: 0;
            width: 90px; height: 90px;
            pointer-events: none;
        }

        .cooldown-ring svg {
            transform: rotate(-90deg);
        }

        .cooldown-ring circle {
            fill: none;
            stroke-width: 3;
        }

        .cooldown-ring .bg { stroke: rgba(255,255,255,0.1); }
        .cooldown-ring .progress {
            stroke: #ffc800;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear;
            filter: drop-shadow(0 0 4px rgba(255, 200, 0, 0.5));
        }

        /* Shoot Button */
        #btn-shoot {
            bottom: 235px; right: 47px;
            width: 70px; height: 70px;
            background: rgba(255, 68, 68, 0.15);
            border: 2px solid rgba(255, 68, 68, 0.4);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.1), inset 0 0 20px rgba(255, 68, 68, 0.05);
        }

        #btn-shoot:active {
            background: rgba(255, 68, 68, 0.4);
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.3), inset 0 0 20px rgba(255, 68, 68, 0.2);
        }

        /* Crouch Button */
        #btn-crouch {
            bottom: 50px; right: 140px;
            width: 55px; height: 55px;
            background: rgba(150, 100, 255, 0.15);
            border: 2px solid rgba(150, 100, 255, 0.4);
            box-shadow: 0 0 15px rgba(150, 100, 255, 0.1);
        }

        #btn-crouch:active, #btn-crouch.active {
            background: rgba(150, 100, 255, 0.4);
            box-shadow: 0 0 25px rgba(150, 100, 255, 0.3);
        }

        /* Sprint Button */
        #btn-sprint {
            bottom: 120px; right: 140px;
            width: 55px; height: 55px;
            background: rgba(0, 255, 136, 0.15);
            border: 2px solid rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
        }

        #btn-sprint:active, #btn-sprint.active {
            background: rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
        }

        /* ========================
           NOTIFICATIONS
        ======================== */
        #notification {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #notification.show {
            opacity: 1;
        }

        /* ========================
           COMPASS
        ======================== */
        #compass {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .compass-marker {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            transition: color 0.3s, transform 0.3s;
        }

        .compass-marker.active {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            transform: scale(1.3);
        }

        /* ========================
           MINI MAP INDICATOR
        ======================== */
        #minimap {
            position: absolute;
            bottom: 30px; left: 30px;
            width: 100px; height: 100px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            pointer-events: none;
            overflow: hidden;
        }

        .minimap-dot {
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background: #00ff88;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.8);
        }

        .minimap-cone {
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid rgba(0, 255, 136, 0.15);
            transform-origin: 50% 0%;
            transform: translate(-50%, 0) rotate(0deg);
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="loader-title">NIGHT OPS</div>
        <div class="loader-bar-container">
            <div class="loader-bar" id="loader-bar"></div>
        </div>
        <div class="loader-text" id="loader-text">Initializing Systems...</div>
    </div>

    <!-- Screen Effects -->
    <div id="speed-overlay">
        <div class="speed-radial"></div>
        <div class="speed-lines"></div>
    </div>
    <div id="vignette"></div>
    <div id="damage-overlay">
        <div class="damage-flash"></div>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- Compass -->
        <div id="compass">
            <span class="compass-marker" id="comp-w">W</span>
            <span class="compass-marker" id="comp-nw">NW</span>
            <span class="compass-marker" id="comp-n">N</span>
            <span class="compass-marker" id="comp-ne">NE</span>
            <span class="compass-marker" id="comp-e">E</span>
        </div>

        <!-- Top Left HUD -->
        <div id="hud-top-left">
            <div class="hud-label">Health</div>
            <div class="hud-value" id="health-value">100</div>
            <div class="hud-bar-container">
                <div class="hud-bar health" id="health-bar" style="width: 100%;"></div>
            </div>
            <div style="margin-top: 12px;">
                <div class="hud-label">Stamina</div>
                <div class="hud-bar-container">
                    <div class="hud-bar stamina" id="stamina-bar" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- Top Right HUD -->
        <div id="hud-top-right">
            <div class="hud-label">Score</div>
            <div class="hud-value" id="score-value">0</div>
        </div>

        <!-- Crosshair -->
        <div id="crosshair-container">
            <div id="crosshair">
                <div class="crosshair-line h hl"></div>
                <div class="crosshair-line h hr"></div>
                <div class="crosshair-line v vt"></div>
                <div class="crosshair-line v vb"></div>
                <div class="crosshair-dot"></div>
            </div>
            <div class="hit-marker" id="hit-marker">✕</div>
        </div>

        <!-- Ammo Display -->
        <div id="ammo-display">
            <span class="ammo-current" id="ammo-current">30</span>
            <span class="ammo-max"> / <span id="ammo-max">30</span></span>
        </div>

        <!-- Notification -->
        <div id="notification"></div>

        <!-- Minimap -->
        <div id="minimap">
            <div class="minimap-cone" id="minimap-cone"></div>
            <div class="minimap-dot"></div>
        </div>

        <!-- Controls -->
        <div id="joystick-left"></div>

        <button id="btn-shoot" class="action-btn">
            <span class="btn-icon">🔫</span>
            <span class="btn-label">FIRE</span>
        </button>

        <div id="btn-dash-container">
            <div class="cooldown-ring">
                <svg width="90" height="90" viewBox="0 0 90 90">
                    <circle class="bg" cx="45" cy="45" r="42"/>
                    <circle class="progress" id="dash-progress" cx="45" cy="45" r="42"
                        stroke-dasharray="263.89" stroke-dashoffset="0"/>
                </svg>
            </div>
            <button id="btn-dash" class="action-btn">
                <span class="btn-icon">⚡</span>
                <span class="btn-label">DASH</span>
            </button>
        </div>

        <button id="btn-jump" class="action-btn">
            <span class="btn-icon">⬆</span>
            <span class="btn-label">JUMP</span>
        </button>

        <button id="btn-crouch" class="action-btn">
            <span class="btn-icon">⬇</span>
            <span class="btn-label">SLIDE</span>
        </button>

        <button id="btn-sprint" class="action-btn">
            <span class="btn-icon">🏃</span>
            <span class="btn-label">SPRINT</span>
        </button>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script>
    (function() {
        'use strict';

        // ==========================================
        // 1. AUDIO SYSTEM
        // ==========================================
        const AudioSys = {
            unlocked: false,
            ctx: null,
            masterGain: null,

            init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.5;
                this.masterGain.connect(this.ctx.destination);
            },

            unlock() {
                if (this.unlocked) return;
                if (!this.ctx) this.init();
                this.ctx.resume();
                this.unlocked = true;
            },

            playTone(freq, duration, type = 'sine', volume = 0.3) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },

            playShoot() {
                if (!this.ctx) return;
                // Layered gunshot sound
                const now = this.ctx.currentTime;

                // Sharp crack
                const noise = this.ctx.createBufferSource();
                const bufferSize = this.ctx.sampleRate * 0.1;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
                }
                noise.buffer = buffer;
                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.8, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                noise.connect(noiseGain);
                noiseGain.connect(this.masterGain);
                noise.start();

                // Low thump
                const osc = this.ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                const oscGain = this.ctx.createGain();
                oscGain.gain.setValueAtTime(0.4, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.connect(oscGain);
                oscGain.connect(this.masterGain);
                osc.start();
                osc.stop(now + 0.2);
            },

            playDash() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(now + 0.3);
            },

            playJump() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(now + 0.15);
            },

            playLand() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(now + 0.2);
            },

            playFootstep() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const noise = this.ctx.createBufferSource();
                const bufferSize = this.ctx.sampleRate * 0.05;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * 0.5;
                }
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 800;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.masterGain);
                noise.start();
            }
        };

        // Unlock audio on first interaction

        // ==========================================

        const scene = new THREE.Scene();

        // Stars

        // ==========================================
        // 4. LOAD ASSETS
        // ==========================================
        const loader = new THREE.GLTFLoader();
        let mapModel = null;
        let gunModel = null;
        let modelsLoaded = 0;
        const totalModels = 2;

        function updateLoader() {
            modelsLoaded++;

            document.getElementById('loader-bar').style.width = pct + '%';
            if (modelsLoaded >= totalModels) {
                document.getElementById('loader-text').textContent = 'Ready';

                    document.getElementById('loading').classList.add('hidden');

        }

        loader.load('map.glb', (gltf) => {
            mapModel = gltf.scene;
            mapModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;

                    // Darken materials for night

                        child.material = child.material.clone();
                        child.material.emissive = new THREE.Color(0x000000);
                        child.material.emissiveIntensity = 0;
                    }
                }
            });
            scene.add(mapModel);

        loader.load('gun.glb', (gltf) => {

        // ==========================================
        // 5. MUZZLE FLASH SYSTEM

        const muzzleLight = new THREE.PointLight(0xffaa00, 0, 15);

        });

        muzzleFlash.position.set(0, -0.05, -1.4);
        muzzleFlash.lookAt(0, -0.05, -2);

        // Shell ejection particles
        const shells = [];

        function ejectShell() {
            const shell = new THREE.Mesh(shellGeo, shellMat);
            shell.position.set(0.2, -0.2, -0.5);
            shell.rotation.z = Math.random() * Math.PI;

        // ==========================================
        // 6. PLAYER PHYSICS & MOVEMENT
        // ==========================================
        const player = {
            height: 40,
            crouchHeight: 20,
            radius: 8,
            baseSpeed: 5.0,
            sprintSpeed: 9.0,
            dashSpeed: 20.0,
            airControl: 0.4,
            gravity: 0.35,
            jumpStrength: 6.5,
            coyoteTime: 0.12,
            maxJumps: 2,

            // State
            pos: new THREE.Vector3(0, 140, 0),
            vel: new THREE.Vector3(0, 0, 0),
            isGrounded: false,
            jumpsUsed: 0,
            coyoteTimer: 0,
            isCrouching: false,
            isSprinting: false,
            isDashing: false,
            dashTimer: 0,
            dashCooldown: 0,
            stamina: 100,
            maxStamina: 100,
            staminaRegen: 30,
            staminaDrain: 40,
            health: 100,
            maxHealth: 100,

            // Camera effects
            bobTimer: 0,
            bobAmount: 0.15,
            recoil: 0,
            recoilRecovery: 5,
            landingImpact: 0,

            // Ammo
            ammo: 30,
            maxAmmo: 30,
            reloadTimer: 0,
            isReloading: false,

            // Slide
            isSliding: false,
            slideTimer: 0,

            // Score
            score: 0
        };

        camera.position.copy(player.pos);

        // ==========================================
        // 7. INPUT HANDLING
        // ==========================================
        const input = {
            move: { x: 0, z: 0 },
            jump: false,
            dash: false,
            shoot: false,
            crouch: false,
            sprint: false
        };

        // Joystick
        const joystickL = nipplejs.create({
            zone: document.getElementById('joystick-left'),
            mode: 'static',
            position: { left: '70px', bottom: '70px' },
            color: 'rgba(0, 212, 255, 0.6)',
            size: 120
        });

        joystickL.on('move', (evt, data) => {
            const angle = data.angle.radian;
            const force = Math.min(data.force, 1);
            input.move.x = Math.cos(angle) * force;
            input.move.z = Math.sin(angle) * force;
        });
        joystickL.on('end', () => { input.move.x = 0; input.move.z = 0; });

        // Touch aim
        let touchId = null;
        let prevTouch = { x: 0, y: 0 };
        const canvas = renderer.domElement;

        canvas.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.clientX > window.innerWidth / 2) {
                    touchId = touch.identifier;
                    prevTouch = { x: touch.clientX, y: touch.clientY };
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === touchId) {
                    const deltaX = touch.clientX - prevTouch.x;
                    const deltaY = touch.clientY - prevTouch.y;
                    camera.rotation.y -= deltaX * 0.003;
                    camera.rotation.x -= deltaY * 0.003;
                    camera.rotation.x = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, camera.rotation.x));
                    prevTouch = { x: touch.clientX, y: touch.clientY };
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) touchId = null;
            }
        });

        // Button handlers
        const btnJump = document.getElementById('btn-jump');
        const btnDash = document.getElementById('btn-dash');
        const btnShoot = document.getElementById('btn-shoot');
        const btnCrouch = document.getElementById('btn-crouch');
        const btnSprint = document.getElementById('btn-sprint');

        function handleBtn(btn, key, toggle = false) {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (toggle) {
                    input[key] = !input[key];
                    btn.classList.toggle('active', input[key]);
                } else {
                    input[key] = true;
                    btn.classList.add('active');
                }
            });
            if (!toggle) {
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    input[key] = false;
                    btn.classList.remove('active');
                });
                btn.addEventListener('touchcancel', (e) => {
                    input[key] = false;
                    btn.classList.remove('active');
                });
            }
        }

        handleBtn(btnJump, 'jump');
        handleBtn(btnDash, 'dash');
        handleBtn(btnShoot, 'shoot');
        handleBtn(btnCrouch, 'crouch', true);
        handleBtn(btnSprint, 'sprint', true);

        // Jump logic
        btnJump.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player.isGrounded || player.coyoteTimer > 0 || player.jumpsUsed < player.maxJumps) {
                if (!player.isGrounded && player.coyoteTimer <= 0) {
                    player.jumpsUsed++;
                }
                player.vel.y = player.jumpStrength;
                player.isGrounded = false;
                player.coyoteTimer = 0;
                AudioSys.playJump();
                showNotification('JUMP!');
            }
        });

        // Dash logic
        btnDash.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player.dashCooldown <= 0 && player.stamina >= 30) {
                player.isDashing = true;
                player.dashTimer = 0.25;
                player.dashCooldown = 2.5;
                player.stamina -= 30;
                player.vel.y = 0;
                AudioSys.playDash();
                showNotification('DASH!');
                document.getElementById('speed-overlay').style.opacity = '1';
                btnDash.classList.add('cooldown');

                // Screen shake
                shakeScreen(0.3, 0.5);
            }
        });

        // Shoot logic
        let lastShotTime = 0;
        const fireRate = 0.1;
        btnShoot.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const now = performance.now() / 1000;
            if (now - lastShotTime < fireRate) return;
            if (player.ammo <= 0 || player.isReloading) {
                if (player.ammo <= 0 && !player.isReloading) startReload();
                return;
            }

            lastShotTime = now;
            player.ammo--;
            updateAmmoDisplay();
            AudioSys.playShoot();
            ejectShell();

            // Muzzle flash
            muzzleLight.intensity = 3;
            muzzleFlashMat.opacity = 0.8;
            muzzleFlash.rotation.z = Math.random() * Math.PI * 2;

            // Gun recoil
            player.recoil = 0.08;
            if (gunModel) {
                gunModel.position.z += 0.15;
                gunModel.rotation.x += 0.1;
            }

            // Hit detection
            raycastShoot();
        });

        function startReload() {
            if (player.isReloading || player.ammo >= player.maxAmmo) return;
            player.isReloading = true;
            showNotification('RELOADING...');
            setTimeout(() => {
                player.ammo = player.maxAmmo;
                player.isReloading = false;
                updateAmmoDisplay();
                showNotification('READY');
            }, 1500);
        }

        function updateAmmoDisplay() {
            document.getElementById('ammo-current').textContent = player.ammo;
            document.getElementById('ammo-max').textContent = player.maxAmmo;
        }

        // Shooting raycaster
        const shootRaycaster = new THREE.Raycaster();
        function raycastShoot() {
            shootRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            // For demo, just show hit marker
            setTimeout(() => {
                const hitMarker = document.getElementById('hit-marker');
                hitMarker.classList.add('active');
                setTimeout(() => hitMarker.classList.remove('active'), 300);
                player.score += 10;
                document.getElementById('score-value').textContent = player.score;
            }, 50);
        }

        // ==========================================
        // 8. SCREEN EFFECTS
        // ==========================================
        let shakeIntensity = 0;
        let shakeDuration = 0;

        function shakeScreen(intensity, duration) {
            shakeIntensity = intensity;
            shakeDuration = duration;
        }

        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.textContent = text;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 1500);
        }

        // ==========================================
        // 9. PHYSICS & ANIMATION LOOP
        // ==========================================
        const floorRaycaster = new THREE.Raycaster();
        const wallRaycaster = new THREE.Raycaster();
        const downVector = new THREE.Vector3(0, -1, 0);
        const clock = new THREE.Clock();
        let wasGrounded = true;
        let footstepTimer = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);
            const time = clock.getElapsedTime();

            if (!mapModel) {
                renderer.render(scene, camera);
                return;
            }

            // --- A. MOVEMENT STATE MACHINE ---
            let currentSpeed = player.baseSpeed;
            let targetHeight = player.height;

            // Sprint
            if (input.sprint && player.stamina > 0 && !player.isCrouching) {
                currentSpeed = player.sprintSpeed;
                player.stamina = Math.max(0, player.stamina - player.staminaDrain * delta);
            } else {
                player.stamina = Math.min(player.maxStamina, player.stamina + player.staminaRegen * delta);
            }

            // Crouch
            if (player.isCrouching) {
                targetHeight = player.crouchHeight;
                currentSpeed *= 0.5;
            }

            // Smooth height transition
            const currentHeight = camera.position.y;
            const heightDiff = targetHeight - currentHeight;
            if (Math.abs(heightDiff) > 0.1) {
                camera.position.y += heightDiff * 10 * delta;
            }

            // Dash
            let targetFov = 75;
            if (player.isDashing) {
                player.dashTimer -= delta;
                currentSpeed = player.dashSpeed;
                targetFov = 100;
                if (player.dashTimer <= 0) {
                    player.isDashing = false;
                    document.getElementById('speed-overlay').style.opacity = '0';
                }
            }

            // Slide (crouch while moving fast)
            if (player.isCrouching && player.isGrounded && (Math.abs(input.move.x) > 0.3 || Math.abs(input.move.z) > 0.3)) {
                if (!player.isSliding) {
                    player.isSliding = true;
                    player.slideTimer = 0.8;
                    // Store slide direction
                    const slideVec = new THREE.Vector3(input.move.x, 0, -input.move.z);
                    slideVec.applyQuaternion(camera.quaternion);
                    slideVec.y = 0;
                    slideVec.normalize();
                    player.slideDir.copy(slideVec);
                    showNotification('SLIDE!');
                }
            }

            if (player.isSliding) {
                player.slideTimer -= delta;
                currentSpeed = player.sprintSpeed * 1.5;
                if (player.slideTimer <= 0 || !player.isCrouching) {
                    player.isSliding = false;
                }
            }

            // Smooth FOV
            camera.fov += (targetFov - camera.fov) * 8 * delta;
            camera.updateProjectionMatrix();

            // Dash cooldown
            if (player.dashCooldown > 0) {
                player.dashCooldown -= delta;
                const progress = document.getElementById('dash-progress');
                const circumference = 2 * Math.PI * 42;
                const offset = circumference * (player.dashCooldown / 2.5);
                progress.style.strokeDashoffset = offset;
                if (player.dashCooldown <= 0) {
                    btnDash.classList.remove('cooldown');
                    btnDash.querySelector('.btn-label').textContent = 'DASH';
                } else {
                    btnDash.querySelector('.btn-label').textContent = Math.ceil(player.dashCooldown) + 's';
                }
            }

            // --- B. HORIZONTAL MOVEMENT ---
            let moveX = 0, moveZ = 0;
            if (player.isSliding) {
                moveX = player.slideDir.x * currentSpeed;
                moveZ = player.slideDir.z * currentSpeed;
            } else {
                moveX = input.move.x * currentSpeed;
                moveZ = input.move.z * currentSpeed;
            }

            const isMoving = Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1;

            if (isMoving && !player.isSliding) {
                const moveVector = new THREE.Vector3(moveX, 0, -moveZ);
                moveVector.applyQuaternion(camera.quaternion);
                moveVector.y = 0;
                moveVector.normalize();

                // Wall collision
                wallRaycaster.set(camera.position, moveVector);
                const wallHits = wallRaycaster.intersectObject(mapModel, true);

                if (wallHits.length === 0 || wallHits[0].distance > player.radius) {
                    // Air control modifier
                    const control = player.isGrounded ? 1.0 : player.airControl;
                    camera.translateX(moveX * control * delta * 10);
                    camera.translateZ(-moveZ * control * delta * 10);
                } else {
                    // Wall run
                    if (!player.isGrounded && player.vel.y < 0) {
                        player.vel.y = -0.03;
                        player.jumpsUsed = 0;
                        if (!player.wallRunning) {
                            player.wallRunning = true;
                            showNotification('WALL RUN');
                        }
                    }
                }
            } else {
                player.wallRunning = false;
            }

            // --- C. CAMERA BOBBING ---
            if (isMoving && player.isGrounded && !player.isSliding) {
                const bobFreq = player.isSprinting ? 18 : 12;
                const bobAmp = player.isSprinting ? 0.08 : 0.05;
                player.bobTimer += delta * bobFreq;
                camera.position.y += Math.sin(player.bobTimer) * bobAmp;
                camera.position.x += Math.cos(player.bobTimer * 0.5) * bobAmp * 0.3;
            }

            // --- D. RECOIL RECOVERY ---
            if (player.recoil > 0) {
                player.recoil -= player.recoilRecovery * delta;
                if (player.recoil < 0) player.recoil = 0;
                camera.rotation.x -= player.recoil * delta * 5;
            }
            if (gunModel) {
                gunModel.position.z = THREE.MathUtils.lerp(gunModel.position.z, -0.8, delta * 10);
                gunModel.rotation.x = THREE.MathUtils.lerp(gunModel.rotation.x, 0, delta * 10);
            }

            // --- E. GRAVITY & FLOOR ---
            player.vel.y -= player.gravity;
            camera.position.y += player.vel.y;

            floorRaycaster.set(camera.position, downVector);
            const floorHits = floorRaycaster.intersectObject(mapModel, true);

            if (floorHits.length > 0) {
                const distToFloor = floorHits[0].distance;
                const floorY = camera.position.y - distToFloor;

                if (distToFloor <= player.height + 2 && player.vel.y <= 0) {
                    // Landing
                    if (!wasGrounded && player.vel.y < -3) {
                        player.landingImpact = Math.min(1, Math.abs(player.vel.y) / 10);
                        shakeScreen(player.landingImpact * 0.2, 0.3);
                        AudioSys.playLand();
                    }
                    camera.position.y = floorY + player.height;
                    player.vel.y = 0;
                    player.isGrounded = true;
                    player.jumpsUsed = 0;
                    player.coyoteTimer = player.coyoteTime;
                } else {
                    player.isGrounded = false;
                }
            } else {
                player.isGrounded = false;
            }

            // Coyote time
            if (player.isGrounded) {
                player.coyoteTimer = player.coyoteTime;
            } else {
                player.coyoteTimer -= delta;
            }

            wasGrounded = player.isGrounded;

            // --- F. LANDING IMPACT ---
            if (player.landingImpact > 0) {
                player.landingImpact -= delta * 3;
                if (player.landingImpact < 0) player.landingImpact = 0;
            }

            // --- G. FOOTSTEP AUDIO ---
            if (isMoving && player.isGrounded) {
                footstepTimer -= delta;
                const stepRate = player.isSprinting ? 0.25 : 0.4;
                if (footstepTimer <= 0) {
                    AudioSys.playFootstep();
                    footstepTimer = stepRate;
                }
            }

            // --- H. MUZZLE FLASH FADE ---
            muzzleLight.intensity = THREE.MathUtils.lerp(muzzleLight.intensity, 0, delta * 15);
            muzzleFlashMat.opacity = THREE.MathUtils.lerp(muzzleFlashMat.opacity, 0, delta * 15);

            // --- I. SHELL PARTICLES ---
            for (let i = shells.length - 1; i >= 0; i--) {
                const s = shells[i];
                s.life -= delta * 2;
                s.mesh.position.add(s.vel);
                s.vel.y -= 0.01; // gravity
                s.mesh.rotation.x += s.rotVel.x;
                s.mesh.rotation.y += s.rotVel.y;
                s.mesh.rotation.z += s.rotVel.z;
                s.mesh.material.opacity = s.life;
                if (s.life <= 0) {
                    camera.remove(s.mesh);
                    shells.splice(i, 1);
                }
            }

            // --- J. SCREEN SHAKE ---
            if (shakeDuration > 0) {
                shakeDuration -= delta;
                const shake = shakeIntensity * (shakeDuration / 0.5);
                camera.position.x += (Math.random() - 0.5) * shake;
                camera.position.y += (Math.random() - 0.5) * shake;
                camera.rotation.z += (Math.random() - 0.5) * shake * 0.5;
                if (shakeDuration <= 0) {
                    shakeIntensity = 0;
                    camera.rotation.z = 0;
                }
            }

            // --- K. FLASHLIGHT FLICKER ---
            const flicker = 1 + Math.sin(time * 20) * 0.02 + Math.sin(time * 47) * 0.01;
            flashlight.intensity = 2.5 * flicker;
            flashlightCone.material.opacity = 0.03 * flicker;

            // --- L. STARS TWINKLE ---
            const sizes = stars.geometry.attributes.size.array;
            for (let i = 0; i < starCount; i++) {
                sizes[i] = (Math.sin(time * 2 + i) * 0.5 + 1) * 1.5;
            }
            stars.geometry.attributes.size.needsUpdate = true;

            // --- M. UPDATE HUD ---
            document.getElementById('stamina-bar').style.width = (player.stamina / player.maxStamina * 100) + '%';
            document.getElementById('health-bar').style.width = (player.health / player.maxHealth * 100) + '%';
            document.getElementById('health-value').textContent = Math.ceil(player.health);

            // Update compass
            const yaw = camera.rotation.y;
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const angle = ((yaw * 180 / Math.PI) % 360 + 360) % 360;
            const idx = Math.round(angle / 45) % 8;
            document.querySelectorAll('.compass-marker').forEach((el, i) => {
                el.classList.toggle('active', i === (7 - idx + 2) % 8);
            });

            // Update minimap
            document.getElementById('minimap-cone').style.transform =
                `translate(-50%, 0) rotate(${-yaw * 180 / Math.PI}deg)`;

            // --- N. UPDATE PLAYER POS ---
            player.pos.copy(camera.position);

            renderer.render(scene, camera);
        }

        animate();

        // ==========================================
        // 10. WINDOW RESIZE
        // ==========================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    })();
    </script>
</body>
</html>
